<title>Jordan's Lead Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="pagestyle">
/* Layout: one column of stage groups, each a colored band; rows read Lead | What happened | Next step. Breakups sink to the bottom in grey. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1b2129; --muted:#5d6774; --line:#dfe3e8; --accent:#2b5fd9;
  --late:#c2361f; --soon:#a86a00;
  --s-closer:#1f8a55; --s-met:#0f6e6a; --s-ccancel:#c4581a; --s-setter:#2b5fd9; --s-held:#7a4fd0;
  --s-scancel:#b8860b; --s-replied:#0e8aa8; --s-chasing:#8a7a12; --s-cold:#c2361f; --s-none:#6b7380; --s-breakup:#8b929c;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --fg:#e7ebf0; --muted:#9aa4b1; --line:#2c3441; --accent:#7ea2ff;
  --late:#ff7a63; --soon:#e0b04a;
  --s-closer:#4cc488; --s-met:#3cbab3; --s-ccancel:#f08a4b; --s-setter:#7ea2ff; --s-held:#b394ff;
  --s-scancel:#e2b443; --s-replied:#4cc3e0; --s-chasing:#d2c25a; --s-cold:#ff7a63; --s-none:#9aa4b1; --s-breakup:#6f7782;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --fg:#e7ebf0; --muted:#9aa4b1; --line:#2c3441; --accent:#7ea2ff;
  --late:#ff7a63; --soon:#e0b04a;
  --s-closer:#4cc488; --s-met:#3cbab3; --s-ccancel:#f08a4b; --s-setter:#7ea2ff; --s-held:#b394ff;
  --s-scancel:#e2b443; --s-replied:#4cc3e0; --s-chasing:#d2c25a; --s-cold:#ff7a63; --s-none:#9aa4b1; --s-breakup:#6f7782;
  color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font:700 clamp(26px,4vw,36px)/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
.meta{display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-size:13px;color:var(--muted)}
.meta .src{font-family:var(--mono);font-size:12px}
button{font:600 14px var(--body);color:#fff;background:var(--accent);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
button.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.notice{margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--soon);background:var(--panel);border-radius:6px;font-size:14px}
.todo{margin-top:20px;padding:14px 16px;background:var(--panel);border:1px solid color-mix(in srgb,var(--late) 35%,var(--line));border-left:5px solid var(--late);border-radius:6px}
.todo.clear{border-color:var(--line);border-left-color:var(--s-closer)}
.todo h2{font:700 20px/1.2 var(--display);margin:0;display:flex;align-items:baseline;gap:10px}
.todo h2 .n{font-family:var(--mono);font-size:14px;color:var(--late)}
.todo>p{margin:4px 0 0;color:var(--muted);font-size:13px}
.todo ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.todo li{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr);gap:4px 16px;padding:8px 0;border-top:1px solid var(--line)}
.todo li .who{display:flex;align-items:center;gap:8px;min-width:0}
.todo li .who a{font:600 15px/1.3 var(--display);color:var(--fg);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--c) 60%,transparent);overflow-wrap:anywhere}
.todo li .what{min-width:0}
.todo li .stg{display:block;font-size:12px;color:var(--muted)}
@media (max-width:620px){.todo li{grid-template-columns:minmax(0,1fr)}}
.chip.req{border-color:var(--late);color:var(--late)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-decoration:none;font-size:13px}
.chip b{font-family:var(--mono);font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
section.grp{margin-top:28px}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:8px;border-bottom:2px solid var(--c)}
.gh h2{font:700 19px/1.2 var(--display);margin:0;display:flex;align-items:center;gap:10px}
.gh .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.gh p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) minmax(0,1.5fr);gap:12px 20px;padding:12px 14px;background:color-mix(in srgb,var(--c) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));border-left:5px solid var(--c);border-radius:6px}
.grp.breakup .row,.grp.deprioritized .row{color:var(--muted)}
.lead a.name{font:600 16px/1.3 var(--display);color:var(--fg);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.lead a.name:hover{border-bottom-color:var(--fg)}
.lead .nolink{font:600 16px/1.3 var(--display)}
.kv{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-direction:column;gap:2px}
.kv span{overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
ol.tl li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:8px}
ol.tl .d{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
ol.tl .bad{color:var(--late)}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.next .act{font-weight:600}
.due{display:inline-block;font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:4px;margin-right:6px;border:1px solid currentColor}
.due.late{color:var(--late)} .due.today{color:var(--soon)} .due.later{color:var(--muted)}
.next .note{font-size:13px;color:var(--muted);margin-top:6px}
.empty{padding:40px 0;color:var(--muted)}
footer{margin-top:40px;font-size:13px;color:var(--muted);max-width:80ch}
@media (max-width:820px){.row{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

async function call(server, tool, input, tries = 2) {
  try {
    const r = await mcp.callTool(server, tool, input, {cache: {staleTime: 120000, gcTime: 86400000}});
    let p = r.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (_) {} }
    return p;
  } catch (e) {
    if (e && e.retryable && tries > 1) {
      await new Promise(res => setTimeout(res, (e.retryAfterMs || 800) + Math.random() * 600));
      return call(server, tool, input, tries - 1);
    }
    throw e;
  }
}
function findKey(obj, key, depth = 0) {
  if (!obj || typeof obj !== "object" || depth > 8) return undefined;
  if (key in obj) return obj[key];
  for (const v of Object.values(obj)) { const f = findKey(v, key, depth + 1); if (f !== undefined) return f; }
  return undefined;
}

async function readTracker() {
  const p = await call("Composio", "COMPOSIO_MULTI_EXECUTE_TOOL", {
    tools: [{tool_slug: "GOOGLESHEETS_BATCH_GET", account: SHEET_ACCOUNT, arguments: {
      spreadsheet_id: SHEET, dateTimeRenderOption: "FORMATTED_STRING",
      ranges: [`${TAB}!D1:F300`, `${TAB}!I1:I300`, `${TAB}!M1:M300`, `${TAB}!W1:W300`]}}],
    sync_response_to_workbench: false });
  const vr = findKey(p, "valueRanges");
  if (!Array.isArray(vr) || vr.length < 4) throw {code: "tool_error", message: "Tracker came back without its columns"};
  const col = i => vr[i].values || [];
  const def = col(0), name = col(1), fwd = col(2), notes = col(3);
  const rows = [];
  for (let i = 1; i < def.length; i++) {
    const [action = "", forwarded = "", owner = ""] = def[i] || [];
    const nm = (name[i] || [])[0];
    if (!nm || forwarded !== "Yes") continue;
    if (!(owner === "Jordan" || /jkempster@/i.test(action))) continue;
    rows.push({name: nm, fwd: parseSheetDate((fwd[i] || [])[0]), note: (notes[i] || [])[0] || ""});
  }
  if (!rows.length) throw {code: "tool_error", message: "No Jordan rows found on the tracker"};
  return rows;
}

async function setterLeads() {
  // Leads in Close whose Setter field is Jordan (the intake Routine sets it), to match new tracker names.
  const out = [];
  let p = await call("Close", "search", {query: "leads where custom field Setter is Jordan Kempster"});
  for (let page = 0; p && page < 5; page++) {
    for (const r of p.results || []) out.push({id: r.lead_id || r.id, name: r.title || r.label});
    if (!p.next_cursor || !p.search_id) break;
    p = await call("Close", "paginate_search", {search_id: p.search_id, cursor: p.next_cursor});
  }
  return out;
}

async function loadLead(id) {
  const leadP = call("Close", "fetch_lead", {id});
  const actsP = (async () => {
    const all = []; let cursor = null;
    for (let page = 0; page < 8; page++) {
      const input = {lead_ids: [id], activity_types: ["activity.call","activity.email","activity.meeting","activity.sms","activity.task_completed"],
        activity_at: {start: "2026-09-01T00:00:00Z"}};
      if (cursor) input.cursor = cursor;
      const p = await call("Close", "activity_search", input);
      all.push(...(p.results || []));
      cursor = p.next_cursor; if (!cursor) break;
    }
    return all;
  })();
  // Close's own direction filter: an email with no date_sent can still be a staff bulk send (VeJohn's "Q3 Wrap Up").
  const inboundP = call("Close", "activity_search", {lead_ids: [id], direction: "inbound",
      activity_types: ["activity.email","activity.sms","activity.call"], activity_at: {start: "2026-09-01T00:00:00Z"}})
    .then(p => new Set((p.results || []).map(r => r.activity_id || r.id)));
  const tasksP = call("Close", "find_tasks", {lead_id: id, is_complete: false}).then(p => p.results || []).catch(() => []);
  const lead = await leadP;
  const contact = lead.primary_contact_id ? await call("Close", "fetch_contact", {id: lead.primary_contact_id}).catch(() => null) : null;
  return {lead, acts: await actsP, inboundIds: await inboundP, tasks: await tasksP, contact};
}

// ---------- reading one lead ----------
function analyse(row, b) {
  const now = new Date(), today = dayKey(now);
  const lead = b.lead;
  const cf = (lead.custom_fields || []).find(f => f.id === "cf_RdUwNTlCpEBzzWDbmzUcPUwPMmQPmO6EZJLsH6olFhM");
  const fwdAt = cf && cf.value ? new Date(cf.value) : row.fwd ? new Date(row.fwd + "T06:00:00Z") : new Date(lead.created_at);
  const fwdDay = row.fwd && (!cf || !cf.value) ? row.fwd : dayKey(fwdAt);
  const statusM = (lead.summaries || [])[0]?.match(/Status: ([^\n]+)/);
  const phone = (b.contact?.phones || [])[0]?.phone || "";
  const email = (b.contact?.emails || [])[0]?.email || "";
  const display = lead.name || row.name;
  const first = (b.contact?.name || display).split(/\s+/)[0].replace(/^./, c => c.toUpperCase());

  const seen = new Set(), touches = [], inbound = [], meetings = [];
  let breakupTaskAt = null, breakupMsgAt = null;
  for (const a of b.acts) {
    let p = {}; try { p = JSON.parse(a.preview || a.text || "{}"); } catch (_) {}
    const at = new Date(a.activity_at || p.activity_at);
    const type = a.activity_type;
    if (type === "activity.meeting") {
      const title = p.title || a.title || "";
      const cancelled = /^cancel/i.test(title) || /declin|cancel/i.test(p.status || "");
      const host = title.replace(/^cancell?ed:\s*/i, "").split(" and ").pop().trim();
      const start = new Date(p.starts_at || a.activity_at);
      if (dayKey(start) < addDays(fwdDay, -1)) continue;       // calls from before Helen's forward
      const setter = SETTERS.includes(norm(host)) || (p.duration && p.duration <= 900 && !/discovery/i.test(p.note || ""));
      meetings.push({start, host, cancelled, setter, upcoming: !cancelled && start > now, held: !cancelled && start <= now});
      continue;
    }
    if (type === "activity.task_completed") {
      if (/^day 5 breakup/i.test(p.task_text || "") && p.user_id === JORDAN) breakupTaskAt = at;
      continue;
    }
    if (at < fwdAt) continue;
    if (type === "activity.email" && at - fwdAt <= 60000) continue;  // Helen's forward itself
    const key = type + "|" + Math.round(at / 1000) + "|" + (p.subject || p.text || "");
    if (seen.has(key)) continue; seen.add(key);
    const kind = type === "activity.email" ? "email" : type === "activity.sms" ? "text" : "call";
    const outbound = type === "activity.call" ? true : !!p.date_sent;
    if (outbound && p.user_id === JORDAN) {
      touches.push({at, kind});
      if (kind === "text" && BREAKUP_RE.test(p.text || "")) breakupMsgAt = at;
    } else if (b.inboundIds && b.inboundIds.has(a.activity_id || a.id)) {
      inbound.push({at, kind});
    }
  }
  // Email bodies are only in the lead summary; catch a breakup email Jordan wrote there.
  for (const blk of (lead.summaries || [])) {
    if (!/^Email thread/.test(blk)) continue;
    for (const msg of blk.split(/\n\n(?=\d{8}\n)/)) {
      const m = msg.match(/^(\d{4})(\d{2})(\d{2})\nFrom: Jordan Kempster/);
      if (m && BREAKUP_RE.test(msg)) { const at = new Date(`${m[1]}-${m[2]}-${m[3]}T18:00:00Z`); if (!breakupMsgAt || at > breakupMsgAt) breakupMsgAt = at; }
    }
  }
  touches.sort((a, b2) => a.at - b2.at); inbound.sort((a, b2) => a.at - b2.at); meetings.sort((a, b2) => a.start - b2.start);

  const setterM = meetings.filter(m => m.setter), closerM = meetings.filter(m => !m.setter);
  const pick = (list, f) => list.filter(f).pop();
  const sUp = setterM.find(m => m.upcoming), sHeld = pick(setterM, m => m.held), sCan = pick(setterM, m => m.cancelled);
  const cUp = closerM.find(m => m.upcoming), cHeld = pick(closerM, m => m.held), cCan = pick(closerM, m => m.cancelled);

  // Breakup: a stop-following-up message, or the Day 5 task marked done while the lead was still cold.
  let breakupAt = breakupMsgAt, breakupHow = "message";
  if (!breakupAt && breakupTaskAt) {
    // Jordan sometimes ticks off all three tasks once a lead books, so a booked or replying lead is not a breakup.
    const warm = inbound.some(x => x.at < breakupTaskAt) || meetings.some(m => !m.cancelled);
    if (!warm) { breakupAt = breakupTaskAt; breakupHow = "task"; }
  }
  const revived = breakupAt && (inbound.some(x => x.at > breakupAt) || meetings.some(m => !m.cancelled && (m.upcoming || m.start > breakupAt)));
  const brokeUp = breakupAt && !revived;

  let stage;
  if (cUp) stage = "closer_booked";
  else if (sUp) stage = "setter_booked";
  else if (brokeUp) stage = "breakup";
  else if (cHeld) stage = "closer_met";
  else if (cCan) stage = "closer_cancelled";
  else if (sHeld) stage = "held_not_set";
  else if (sCan) stage = "setter_cancelled";
  else if (inbound.length) stage = "replied";
  else if (touches.length) stage = "chasing";
  else stage = "not_contacted";

  // ----- what happened -----
  const tl = [];
  tl.push({k: fwdDay, t: "Helen forwarded to Jordan"});
  const byDay = new Map();
  for (const t of touches) { const k = dayKey(t.at); if (!byDay.has(k)) byDay.set(k, new Set()); byDay.get(k).add(t.kind); }
  const days = [...byDay.keys()];
  if (days.length) {
    const lag = Math.round((kdate(days[0]) - kdate(fwdDay)) / 864e5);
    tl.push({k: days[0], t: `Jordan responded (${[...byDay.get(days[0])].join(" + ")})${lag === 0 ? ", same day" : `, ${lag} day${lag > 1 ? "s" : ""} after the forward`}`, bad: lag > 1});
    const rest = days.slice(1);
    for (const k of rest.slice(0, 3)) tl.push({k, t: `Jordan followed up (${[...byDay.get(k)].join(" + ")})`});
    if (rest.length > 3) tl.push({k: rest[rest.length - 1], t: `${rest.length - 3} more follow-ups, latest`});
  } else {
    tl.push({k: today, t: "No email, text or call from Jordan in Close yet", bad: true});
  }
  if (inbound.length) {
    tl.push({k: dayKey(inbound[0].at), t: `${first} replied (${inbound[0].kind})`});
    if (inbound.length > 1) tl.push({k: dayKey(inbound[inbound.length - 1].at), t: `${first}'s latest reply (${inbound.length} in all)`});
  }
  for (const m of meetings) {
    const who = m.setter ? (norm(m.host) === "jordan kempster" ? "Setter call with Jordan" : `Setter call with ${m.host}`) : `Closer call with ${m.host}`;
    tl.push({k: dayKey(m.start), t: `${who}: ${m.cancelled ? "cancelled" : m.upcoming ? `booked for ${dow(dayKey(m.start))} ${timeOf(m.start)}` : "held"}`, bad: m.cancelled});
  }
  if (sHeld && !closerM.some(m => !m.cancelled)) tl.push({k: dayKey(sHeld.start), t: "Did not ascend to a closer", bad: true});
  if (breakupAt) tl.push({k: dayKey(breakupAt), t: breakupHow === "task" ? "Breakup email sent (Day 5 task marked done)" : "Breakup message sent", bad: false});
  if (revived) tl.push({k: today, t: `${first} came back after the breakup`});
  tl.sort((a, b2) => a.k < b2.k ? -1 : a.k > b2.k ? 1 : 0);

  // ----- next step -----
  const callIt = phone ? `call ${fmtPhone(phone)}` : "ask for the best number";
  const tomorrow = nextBiz(addDays(today, 1));
  const openTask = (b.tasks || []).filter(t => t.assigned_to === JORDAN && !/^day [125]/i.test(t.text || "")).sort((x, y) => (x.due_date || "") < (y.due_date || "") ? -1 : 1)[0];
  const taskDue = openTask?.due_date ? openTask.due_date.slice(0, 10) : null;
  let action, due = null, note = "";
  const day2 = addBiz(fwdDay, 1), day5 = addDays(fwdDay, 5);
  switch (stage) {
    case "closer_booked": {
      const k = dayKey(cUp.start);
      due = k === today ? today : addDays(k, -1);
      action = k === today ? `Closer call with ${cUp.host} is today at ${timeOf(cUp.start)}. Text ${first} a reminder this morning.` :
        `Text ${first} on ${md(due)} to confirm the ${md(k)} call with ${cUp.host}.`;
      break; }
    case "setter_booked": {
      const k = dayKey(sUp.start);
      due = k === today ? today : addDays(k, -1);
      action = k === today ? `Intro call today at ${timeOf(sUp.start)}. Book the closer call before hanging up.` :
        `Confirm by text on ${md(due)} for the ${md(k)} intro call; book the closer call live on the call.`;
      break; }
    case "closer_met":
      action = `Closer stage. Check the outcome with ${cHeld.host}; nothing for Jordan unless they hand it back.`;
      break;
    case "closer_cancelled":
      due = minDay(dayKey(cCan.start), today);   // keep the real due date so it reads as overdue
      action = `Rebook the closer call: ${callIt} today, don't just email.`;
      break;
    case "held_not_set":
      if (taskDue) { due = taskDue; action = `Follow up on ${md(taskDue)} (task in Close: "${(openTask.text || "").slice(0, 60)}").`; }
      else { due = minDay(nextBiz(addDays(dayKey(sHeld.start), 1)), today); action = `No follow-up date set. Decide today: reopen with ${first} or close it out, and add a dated task in Close.`; }
      note = row.note ? `Tracker note: ${row.note}` : "";
      break;
    case "setter_cancelled":
      due = minDay(dayKey(sCan.start), today);
      action = `Rebook the intro: ${callIt} today and resend the calendar link.`;
      break;
    case "replied":
      due = inbound[inbound.length - 1].at > (touches[touches.length - 1]?.at || 0) ? today : tomorrow;
      action = `${first} replied ${md(dayKey(inbound[inbound.length - 1].at))}. ${phone ? `Call ${fmtPhone(phone)}` : "Reply and ask for a number"} on ${md(due)} and book the intro live.`;
      break;
    case "chasing": {
      const n = days.length;
      if (n < 2) { due = day2; action = `Day 2 follow-up: ${callIt} and email on Helen's thread ${day2 <= today ? "today" : `on ${md(day2)}`}.`; }
      else { due = day5; action = `Send the breakup email ("Should I stop following up?") ${day5 <= today ? "today" : `on ${md(day5)}`}, then mark low priority.`; }
      break; }
    case "not_contacted":
      due = fwdDay;
      action = `First touch is overdue (forward was ${md(fwdDay)}): reply on Helen's thread and ${callIt} today.`;
      break;
    case "breakup":
      action = `Low priority. Only re-engage if ${first} replies.`;
      if (taskDue) { due = taskDue; action += ` Open task due ${md(taskDue)}.`; }
      break;
  }
  if (taskDue && stage !== "held_not_set" && stage !== "breakup" && !note) note = `Open task in Close due ${md(taskDue)}: ${(openTask.text || "").slice(0, 70)}`;
  return {stage, name: display, trackerName: row.name, id: lead.id, status: statusM ? statusM[1] : "", phone, email, fwdDay, tl, action, due, note,
          sortKey: (due || "9999") + display.toLowerCase()};
}

const minDay = (a, b) => a < b ? a : b;

// ---------- render ----------
function dueTag(k) {
  if (!k) return "";
  const today = dayKey(new Date());
  const cls = k < today ? "late" : k === today ? "today" : "later";
  const txt = k < today ? `overdue ${md(k)}` : k === today ? "today" : `${dow(k)} ${md(k)}`;
  return `<span class="due ${cls}">${txt}</span>`;
}
function rowHTML(m) {
  const link = m.id ? `<a class="name" href="https://app.close.com/lead/${esc(m.id)}/" target="_blank" rel="noopener">${esc(m.name)}</a>` : `<span class="nolink">${esc(m.name)}</span>`;
  const kv = [];
  if (m.trackerName && norm(m.trackerName) !== norm(m.name)) kv.push(`<span>Tracker: ${esc(m.trackerName)}</span>`);
  if (m.status) kv.push(`<span>Close status: ${esc(m.status)}</span>`);
  if (m.phone) kv.push(`<span class="mono">${esc(fmtPhone(m.phone))}</span>`);
  if (m.email) kv.push(`<span>${esc(m.email)}</span>`);
  const tl = (m.tl || []).map(x => `<li><span class="d">${md(x.k)}</span><span class="${x.bad ? "bad" : ""}">${esc(x.t)}</span></li>`).join("");
  return `<article class="row"><div class="lead">${link}<div class="kv">${kv.join("")}</div></div>
    <div><div class="lbl">What happened</div><ol class="tl">${tl}</ol></div>
    <div class="next"><div class="lbl">Next step</div><div class="act">${dueTag(m.due)}${esc(m.action)}</div>${m.note ? `<div class="note">${esc(m.note)}</div>` : ""}</div></article>`;
}
function render(models) {
  const groups = STAGES.map(s => ({...s, rows: models.filter(m => m.stage === s.key).sort((a, b) => a.sortKey < b.sortKey ? -1 : 1)})).filter(g => g.rows.length);
  renderActions(models);
  const due = dueNow(models).length;
  $("chips").innerHTML = (due ? `<a class="chip req" href="#action-required"><span class="dot" style="--c:var(--late)"></span>Action required <b>${due}</b></a>` : "") + groups.map(g => `<a class="chip" href="#${g.key}" style="--c:var(${g.c})"><span class="dot"></span>${esc(g.label)} <b>${g.rows.length}</b></a>`).join("");
  $("list").innerHTML = groups.map(g => `<section class="grp ${g.key}" id="${g.key}" style="--c:var(${g.c})">
      <div class="gh"><h2><span class="dot"></span>${esc(g.label)}</h2><span class="n">${g.rows.length} lead${g.rows.length > 1 ? "s" : ""}</span><p>${esc(g.desc)}</p></div>
      <div class="rows">${g.rows.map(rowHTML).join("")}</div></section>`).join("") || `<p class="empty">No leads found.</p>`;
}
// Everything due today or earlier, worked out when the page is opened, so a saved copy stays right day to day.
const QUIET = ["breakup", "deprioritized", "closer_met"];
function dueNow(models) {
  const today = dayKey(new Date());
  return models.filter(m => m.due && m.due <= today && !QUIET.includes(m.stage))
    .sort((a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1);
}
function renderActions(models) {
  const box = $("action-required"), list = dueNow(models);
  box.hidden = false;
  const label = k => (STAGES.find(s => s.key === k) || {}).label || "";
  const color = k => (STAGES.find(s => s.key === k) || {}).c || "--s-none";
  if (!list.length) {
    const today = dayKey(new Date());
    const next = models.filter(m => m.due && m.due > today && !QUIET.includes(m.stage)).sort((a, b) => a.due < b.due ? -1 : 1)[0];
    box.className = "todo clear";
    box.innerHTML = `<h2>Action required <span class="n">0</span></h2><p>Nothing due today.${next ? ` Next up: ${esc(next.name)}, ${dow(next.due)} ${md(next.due)}.` : ""}</p>`;
    return;
  }
  const late = list.filter(m => m.due < dayKey(new Date())).length;
  box.className = "todo";
  box.innerHTML = `<h2>Action required for Jordan <span class="n">${list.length}</span></h2>
    <p>${late ? `${late} overdue, ` : ""}${list.length - late} due today. Oldest first.</p>
    <ol>${list.map(m => `<li style="--c:var(${color(m.stage)})"><div class="who"><span class="dot"></span>${m.id ? `<a href="https://app.close.com/lead/${esc(m.id)}/" target="_blank" rel="noopener">${esc(m.name)}</a>` : `<b>${esc(m.name)}</b>`}</div>
      <div class="what">${dueTag(m.due)}${esc(m.action)}<span class="stg">${esc(label(m.stage))}</span></div></li>`).join("")}</ol>`;
}
function notice(msg) { const n = $("notice"); n.hidden = !msg; n.textContent = msg || ""; }
function errText(e, server) {
  const c = e && e.code;
  if (c === "server_not_connected" || c === "selection_required") return `Add the ${server} connector in claude.ai Settings, Connectors.`;
  if (c === "needs_reauth") return `Reconnect ${server} in claude.ai Settings, Connectors.`;
  if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return `${server} is not allowed for this page. Allow it from the page's permissions menu.`;
  return (e && e.message) || `${server} did not answer.`;
}

// ---------- run ----------
let running = false;
async function refresh() {
  if (running || !mcp) return; running = true;
  const btn = $("refresh"); btn.disabled = true; btn.textContent = "Refreshing…";
  $("bar").hidden = false; $("barfill").style.width = "4%"; notice("");
  const msgs = [];
  let rows, srcTracker = "live";
  try { rows = await readTracker(); }
  catch (e) { srcTracker = "saved list"; rows = ROSTER.map(([name, f]) => ({name, fwd: parseSheetDate(f), note: ""}));
    msgs.push(`Tracker not read live (${errText(e, "Composio")}); using the list saved on 10/13, so newer forwards may be missing.`); }
  // Match tracker names to Close leads.
  const unknown = rows.filter(r => !(norm(r.name) in LEAD_IDS));
  if (unknown.length) {
    try {
      const sl = await setterLeads();
      for (const r of unknown) { const hit = sl.filter(s => norm(s.name) === norm(r.name)); r.id = hit.length === 1 ? hit[0].id : null; }
    } catch (e) { msgs.push(`Could not search Close for ${unknown.length} new tracker name(s).`); }
  }
  for (const r of rows) if (norm(r.name) in LEAD_IDS) r.id = LEAD_IDS[norm(r.name)];
  // One row per Close lead (the tracker can list a person twice).
  const seenIds = new Set(); rows = rows.filter(r => !r.id || (seenIds.has(r.id) ? false : (seenIds.add(r.id), true)));
  $("barfill").style.width = "10%";
  const models = []; let done = 0, failed = 0, firstErr = null;
  const queue = rows.slice();
  async function worker() {
    while (queue.length) {
      const r = queue.shift();
      const parked = DEPRIORITIZED[norm(r.name)];
      if (parked) {
        models.push({stage: "deprioritized", name: r.name, id: r.id || null, fwdDay: r.fwd, tl: [{k: r.fwd || dayKey(new Date()), t: "Helen forwarded to Jordan"}],
          action: "None. Low priority.", due: null, note: parked, sortKey: r.name.toLowerCase()});
      } else if (!r.id) {
        models.push({stage: "no_close", name: r.name, id: null, fwdDay: r.fwd, tl: [{k: r.fwd || dayKey(new Date()), t: "Helen forwarded to Jordan"}],
          action: "Create the lead in Close (or find it by email) so Jordan's follow-up is tracked.", due: null, note: r.note, sortKey: r.name.toLowerCase()});
      } else {
        try { models.push(analyse(r, await loadLead(r.id))); }
        catch (e) { failed++; firstErr = firstErr || e;
          models.push({stage: "error", name: r.name, id: r.id, fwdDay: r.fwd, tl: [{k: r.fwd || dayKey(new Date()), t: "Helen forwarded to Jordan"}],
            action: errText(e, "Close"), due: null, note: "", sortKey: r.name.toLowerCase()}); }
      }
      done++; $("barfill").style.width = `${10 + 90 * done / rows.length}%`;
      if (done % 8 === 0) render(models);
    }
  }
  await Promise.all(Array.from({length: 6}, worker));
  if (failed === rows.length && firstErr) msgs.unshift(`Close could not be read: ${errText(firstErr, "Close")}`);
  else if (failed) msgs.push(`${failed} lead(s) could not be loaded from Close; they are listed under "Could not load".`);
  render(models);
  const stamp = new Date();
  latest = {at: stamp.toISOString(), models, src: `${models.length} leads · tracker: ${srcTracker}`};
  showStamp(latest, "Live from Close");
  notice(msgs.join(" "));
  $("bar").hidden = true; btn.disabled = false; btn.textContent = "Refresh from Close"; running = false;
  if (art && !readOnly) { $("save").hidden = false; $("save").disabled = false; $("save").textContent = "Save for Jordan"; }
}

// ---------- saving a snapshot into the page, for viewers without Close ----------
let art = null, latest = null, readOnly = false;
const fmtStamp = iso => new Date(iso).toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZone: TZ, timeZoneName:"short"});
function showStamp(snap, label) {
  $("updated").textContent = `${label} · ${fmtStamp(snap.at)}`;
  $("src").textContent = snap.src || "";
}
function buildPage(snap) {
  const reset = (document.head.querySelector("style") || {}).textContent || "";
  const json = JSON.stringify(snap).replace(/</g, "\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset +
    "</style></head><body><title>Jordan's Lead Tracker</title>" + FONTS + '<style id="pagestyle">' + STYLE + '</style>\n<div id="app"></div>\n' +
    '<script type="application/json" id="snap">' + json + "<\/script>\n<script>" + SELF + "<\/script></body></html>";
}
async function save() {
  if (!art || !latest) return;
  const b = $("save"); b.disabled = true; b.textContent = "Saving…";
  try {
    await art.publish(buildPage(latest));      // every open view, this one included, reloads to the saved version
    b.textContent = "Saved";
  } catch (e) {
    const c = e && e.code;
    if (c === "conflict") { b.textContent = "Reloading…"; return; }
    if (c === "not_writer" || c === "not_granted" || c === "consent_required" || c === "capability_disabled" || c === "not_declared") {
      readOnly = true; b.hidden = true;
      notice("Saving is only available to the page's owner, signed in to Claude. Jordan sees the last version Sheila saved.");
      return;
    }
    b.disabled = false; b.textContent = "Save for Jordan";
    notice(c === "too_large" ? "The snapshot is too large to save." : `Could not save: ${(e && e.message) || "try again in a minute"}.`);
  }
}

// Show the saved snapshot straight away. Viewers with Close (Sheila) also get live data and can save it.
if (SNAP && Array.isArray(SNAP.models)) { render(SNAP.models); showStamp(SNAP, "Saved"); }
else $("list").innerHTML = '<p class="empty">No saved version yet. Sheila saves one from her view of this page.</p>';
$("refresh").addEventListener("click", refresh);
$("save").addEventListener("click", save);
(async () => {
  const [m, a] = await Promise.all([window.claude && window.claude.use ? window.claude.use("mcp") : null, window.claude && window.claude.use ? window.claude.use("artifact") : null]);
  mcp = m; art = a;
  if (!mcp) return;                              // read-only viewer: the saved snapshot is the page
  $("refresh").hidden = false;
  const age = SNAP && SNAP.at ? Date.now() - new Date(SNAP.at) : Infinity;
  if (age > 10 * 60 * 1000) refresh();           // a version saved a moment ago needs no reload
})();
})();
</script>
